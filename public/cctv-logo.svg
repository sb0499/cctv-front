<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Modern Gradient Palette -->
    <linearGradient id="siccGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="50%" stop-color="#2563eb" /> <!-- Blue 600 -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- Sky 600 -->
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Minimal Shield Container -->
  <path d="M60 12 L100 28 C100 68 82 96 60 108 C38 96 20 68 20 28 Z" 
        fill="url(#siccGradient)" 
        filter="url(#softGlow)" />

  <!-- Inner Subtle Accent Border -->
  <path d="M60 19 L93 33.5 C93 68.5 77.5 93 60 102.5 C42.5 93 27 68.5 27 33.5 Z" 
        stroke="white" 
        stroke-opacity="0.25" 
        stroke-width="1.5" 
        fill="none" />

  <!-- Minimal Camera Lens & Aperture Motif -->
  <!-- Camera Body Contour -->
  <rect x="40" y="44" width="40" height="28" rx="8" fill="white" />
  
  <!-- Camera Lens Outer Ring -->
  <circle cx="60" cy="58" r="9" fill="url(#siccGradient)" />
  
  <!-- Camera Lens Reflection Inner Dot -->
  <circle cx="60" cy="58" r="4" fill="white" />
  <circle cx="62" cy="56" r="1.5" fill="#38bdf8" />

  <!-- Top Camera Flash / Sensor Notch -->
  <rect x="52" y="39" width="16" height="5" rx="2.5" fill="white" opacity="0.9" />

  <!-- Status Indicator Dot -->
  <circle cx="73" cy="50" r="2" fill="#ef4444" />
</svg>