<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/> <!-- Deep Corporate Blue -->
      <stop offset="60%" stop-color="#0f172a"/> <!-- Dark Navy Slate -->
      <stop offset="100%" stop-color="#1e1b4b"/> <!-- Indigo Shadow -->
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/> <!-- Bright Blue -->
      <stop offset="100%" stop-color="#60a5fa"/> <!-- Light Blue Accent -->
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Shield/Hexagon Container -->
  <path d="M50 8 L85 28 L85 72 L50 92 L15 72 L15 28 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Outer glowing decorative thin border -->
  <path d="M50 14 L80 31.5 L80 68.5 L50 86 L20 68.5 L20 31.5 Z" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" stroke-linejoin="round"/>

  <!-- Stylized Camera Icon -->
  <g transform="translate(0, 0)" filter="url(#shadow)">
    <!-- Bracket / mount -->
    <path d="M35 62 L42 62 L42 52" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 67 L47 67" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Camera Body -->
    <rect x="34" y="32" width="28" height="18" rx="4" fill="url(#accentGrad)" />
    <!-- Camera Lens Cover -->
    <path d="M62 35 L74 29 L74 53 L62 47 Z" fill="url(#accentGrad)" opacity="0.9" stroke="url(#accentGrad)" stroke-width="1" stroke-linejoin="round" />
    
    <!-- Camera Lens details -->
    <circle cx="48" cy="41" r="5.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="48.5" cy="40.5" r="2" fill="#60a5fa" />
    
    <!-- Red recording dot (corporate status pulse) -->
    <circle cx="39" cy="37" r="1.5" fill="#ef4444" />
  </g>
</svg>